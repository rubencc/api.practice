services:
  mongodb:
    container_name: mongodb
    image: mongo:${MONGO_VERSION:?err}
    profiles: ["infrastructure"]
    command: >
      bash -c "
        mongod --replSet rs-local --bind_ip_all --port 27017 --fork --logpath /var/log/mongodb.log &&
        until mongosh --eval 'print(\"MongoDB está listo\")' > /dev/null 2>&1; do sleep 2; done &&
        mongosh --eval '
          try {
            rs.status();
            print(\"Replica set ya inicializado\");
          } catch (e) {
            rs.initiate({
              _id: \"rs-local\",
              members: [
                { _id: 0, host: \"mongodb:27017\" }
              ]
            });
            print(\"Replica set rs-local inicializado\");
          }
        ' &&
        tail -f /var/log/mongodb.log
      "
    restart: ${RESTART_ON_FAILURE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: COR_WriteDb
    ports:
      - ${MONGO_PORT:?err}:${MONGO_PORT:?err}
    networks:
      - localnet
  
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:${OTELCOLLECTOR_VERSION}
    profiles: [ "infrastructure-monitoring" ]
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    restart: ${RESTART_ON_FAILURE}
    volumes:
      - ./monitoring/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - otelcollector_log:/etc/output:rw # Store the logs
    ports:
      - "8890:8890"   # Prometheus metrics exposed by the collector
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiverz
      - "1333:1333"   # HealtCheck
    networks:
      - localnet

  prometheus:
    container_name: prometheus
    image: prom/prometheus:${PROMETHEUS_VERSION}
    profiles: [ "infrastructure-monitoring" ]
    restart: ${RESTART_ON_FAILURE}
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - localnet

  tempo:
    container_name: tempo
    image: grafana/tempo:${TEMPO_VERSION}
    profiles: [ "infrastructure-monitoring" ]
    command: [ "-config.file=/etc/tempo.yaml" ]
    restart: ${RESTART_ON_FAILURE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - 3200:3200  # tempo
      - 4007:4317  # otlp grpc
      - 4008:4318  # otlp http
    networks:
      - localnet

  loki:
    container_name: loki
    image: grafana/loki:${LOKI_VERSION}
    profiles: [ "infrastructure-monitoring" ]
    command: -config.file=/etc/loki/local-config.yaml
    restart: ${RESTART_ON_FAILURE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/loki/loki.yaml:/etc/loki/local-config.yaml
    ports:
      - 3100:3100
    networks:
      - localnet

  grafana:
    container_name: grafana
    image: grafana/grafana:${GRAFANA_VERSION}
    profiles: [ "infrastructure-monitoring" ]
    restart: ${RESTART_ON_FAILURE}
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - K6_INFLUXDB_GRAFANA_TOKEN=my-super-secret-auth-token
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - 3000:3000
    networks:
      - localnet

volumes:
  mongodb_data:
  mongodb_config:

networks:
  localnet:
    driver: bridge
  infrastructure_localnet:
    external: true